name: ファクトリーの検証

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: シェル構文の検査
        shell: bash
        run: |
          bash -n \
            install.sh \
            template/.claude/hooks/*.sh \
            template/.claude/scripts/*.sh \
            template/.factory/scripts/*.sh \
            tests/*.sh

      - name: JSON設定の検査
        run: jq empty template/.claude/settings.json template/.codex/hooks.json

      - name: ファクトリーのテスト実行
        run: bash tests/run.sh
