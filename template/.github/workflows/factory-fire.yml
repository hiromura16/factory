# 任意。Issue起点のトリアージを即時実行したい場合にだけ追加します。
#
# このファイルが必要な理由: Claude Codeのルーチンが対応するGitHubトリガーは
# pull_requestとreleaseイベントのみです。issuesトリガーはありません。
# そのため標準ルーチンだけでは「新規Issue→トリアージ」の正規フローを
# イベント駆動にできません。
#
# 補う方法は2つあります:
# A. 未トリアージのIssueを定期ルーチンでポーリングする。
#    既定の方式で標準機能だけを使い、追加ファイル不要。遅延は最大1時間。
#    まずはこちらから始めてください。
# B. このGitHub Actionで、Issue作成時にルーチンのAPIトリガーへPOSTする。
#    ほぼ即時に実行できますが、YAMLファイル1つとシークレット1つが必要です。
#
# Bはトリアージの遅延が本当に問題になる場合だけ使ってください。
# 個人用・新規開発のリポジトリでは通常不要です。Aなら追加の非標準要素は不要です。
#
# Bの設定:
# 1. claude.ai/code/routinesでトリアージルーチンを作成（ROUTINES.md参照）。
# 2. 編集してAPIトリガーを追加し、トークンを生成。一度しか表示されません。
# 3. リポジトリのシークレットを追加:
#      CLAUDE_ROUTINE_URL    ルーチンの/fireエンドポイントURL
#      CLAUDE_ROUTINE_TOKEN  Bearerトークン
# 4. このファイルをコミット。
#
# プロンプトについて: ここから送るtextは、信頼できないデータと明示した
# <routine-fire-payload>ブロックで届きます。処理させるには保存済みプロンプトから
# ペイロードを参照する必要があります。トークンを持つ誰もがテキストを送れるため、
# 指示ではなくデータとして届くこの仕組みは意図的なものです。迂回しないでください。

name: factory-fire

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: read

jobs:
  fire:
    runs-on: ubuntu-latest
    # ファクトリー自身のIssueは除外し、モニターの自己出力によるループを防ぎます。
    if: ${{ !contains(github.event.issue.labels.*.name, 'factory:monitor') }}
    steps:
      - name: トリアージルーチンの起動
        env:
          URL: ${{ secrets.CLAUDE_ROUTINE_URL }}
          TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$URL" ] || [ -z "$TOKEN" ]; then
            echo "ルーチンのシークレットが未設定のためスキップします。定期トリアージが処理します。"
            exit 0
          fi

          # 識別情報だけを渡します。ルーチンは組み込みGitHubツールでIssueを取得します。
          # 信頼できないIssue本文をペイロードに載せず、通常の保護された手順で
          # 読み取れるようにします。
          PAYLOAD=$(jq -nc --arg t "${REPO} のIssue #${NUMBER}（\"${TITLE}\"）をトリアージしてください。" '{text:$t}')

          curl -sS -X POST "$URL" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            --fail-with-body
